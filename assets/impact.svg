<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Impact: 2,000+ financial documents in RAG, 4 GenAI apps shipped, 35% less manual effort, ~15 hours saved weekly, 50+ evaluation scenarios">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <style>
      .num { font: 700 48px -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; letter-spacing: -1px; fill: url(#accent); }
      .cap { font: 500 18px -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill: #e2e8f0; }
      .sub { font: 400 14px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #64748b; letter-spacing: .5px; }
    </style>
  </defs>
  <rect width="1200" height="190" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="189" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <g stroke="#ffffff" stroke-opacity="0.07">
    <line x1="240" y1="40" x2="240" y2="150"/>
    <line x1="480" y1="40" x2="480" y2="150"/>
    <line x1="720" y1="40" x2="720" y2="150"/>
    <line x1="960" y1="40" x2="960" y2="150"/>
  </g>

  <g transform="translate(120 0)" text-anchor="middle"><g class="tile">
    <text class="num" x="0" y="92">2,000+</text>
    <text class="cap" x="0" y="128">financial docs in RAG</text>
    <text class="sub" x="0" y="154">+20% answer relevance</text>
  </g></g>
  <g transform="translate(360 0)" text-anchor="middle"><g class="tile t2">
    <text class="num" x="0" y="92">4</text>
    <text class="cap" x="0" y="128">GenAI apps shipped</text>
    <text class="sub" x="0" y="154">~30% faster to production</text>
  </g></g>
  <g transform="translate(600 0)" text-anchor="middle"><g class="tile t3">
    <text class="num" x="0" y="92">35%</text>
    <text class="cap" x="0" y="128">less manual effort</text>
    <text class="sub" x="0" y="154">6 processes automated</text>
  </g></g>
  <g transform="translate(840 0)" text-anchor="middle"><g class="tile t4">
    <text class="num" x="0" y="92">~15h</text>
    <text class="cap" x="0" y="128">saved every week</text>
    <text class="sub" x="0" y="154">AI copilots in ops</text>
  </g></g>
  <g transform="translate(1080 0)" text-anchor="middle"><g class="tile t5">
    <text class="num" x="0" y="92">50+</text>
    <text class="cap" x="0" y="128">LLM eval scenarios</text>
    <text class="sub" x="0" y="154">golden-dataset evals</text>
  </g></g>
</svg>
